<style>
/* ===== LOOK & FEEL: change colours here ===== */
:root{--bg1:#1a0b3d;--bg2:#0b1d4a;--pink:#ff2d95;--cyan:#00e5ff;--yellow:#ffd60a;--text:#fff;--card:rgba(255,255,255,.09)}

body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--text);min-height:100vh;

.gcard .ic{display:inline-block;animation:float 2.6s ease-in-out infinite}
.fee{animation:pulse 1.8s ease-in-out infinite}
.hero h1{background-size:200% auto;animation:shine 4s linear infinite}
.hero p{animation:rise .8s both .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}

<script>
// ================= EDIT HERE (settings) =================
const CFG={
  EVENT_NAME:"Game Zone",                       // title shown on top
  CURRENCY:"pts",                               // 1 pt = 1 rupee (your choice)
  SUPABASE_URL:"https://zcinfveweiirbuapsrzn.supabase.co",            // Supabase > Project Settings > API
  SUPABASE_KEY:"sb_publishable_cJVKnUFVOnTEa9QajBBEZg_8qurMRXo",       // the "anon public" key
  SITE_URL:"https://vabesh-lucky.github.io/gamezone/", // your final website address (keep trailing /)

};
// ========================================================
const db=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qrUrl=l=>'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(l);
let scanner=null;
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}}
async function route(){
  await stopScan();const h=location.hash||'#/';
  if(h.startsWith('#/card/'))return card(h.slice(7));
  if(h.startsWith('#/lucky'))return lucky();
  if(h.startsWith('#/admin'))return staff('admin');
  if(h.startsWith('#/volunteer')||h.startsWith('#/staff'))return staff('volunteer');

}
addEventListener('hashchange',route);route();
const hidePre=()=>{const p=$('#pre');p&&p.classList.add('hide')};
(function(){const t0=performance.now(),el=$('#pct'),fill=$('#pfill');let ready=document.readyState==='complete';addEventListener('load',()=>ready=true);
function tick(t){const p=Math.min(1,(t-t0)/2000);el.textContent=Math.round(p*100)+'%';fill.style.width=p*100+'%';if(p<1||!ready)requestAnimationFrame(tick);else setTimeout(hidePre,300)}
requestAnimationFrame(tick);setTimeout(hidePre,6000)})();

// ===== EDIT HERE: fortune messages =====
const FORTUNES=["A steady hand will be rewarded today.","Luck favours the curious. Try something new.","Your next move carries more fate than you think.","Patience now, prizes later.","A bold choice is written in your stars.","Today, precision beats power.","Calm focus will outplay luck.","The unexpected path leads to the best story."];
let HG=[];
function tell(){
  const b=$('#ball'),t=$('#ftxt');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');t.style.opacity=0;
  setTimeout(()=>{const f=FORTUNES[Math.floor(Math.random()*FORTUNES.length)],g=HG.length?HG[Math.floor(Math.random()*HG.length)]:null,n=Math.floor(Math.random()*9)+1;
  t.innerHTML=`<em>“${f}”</em><br><span class=lucky>Lucky number <b>${n}</b>${g?` &nbsp;·&nbsp; Lucky game <b>${esc(g.name)}</b>`:''}</span>`;t.style.opacity=1},900);
}
async function home(){
  const{data:g}=await db.from('games').select('*').eq('active',true).order('id');
  const seen={};HG=(g||[]).filter(x=>!seen[x.name]&&(seen[x.name]=1));
  app.innerHTML=`<div class=hero><img class=herologo src="logo.png" alt="${esc(CFG.EVENT_NAME)}" onerror="this.style.display='none'"><h1 class=sr>${esc(CFG.EVENT_NAME)}</h1></div>
  <div class=fortune><div class=bwrap><div class=ball id=ball></div><div class=stand></div></div><div class=fbody><h3>The Fortune Teller</h3><div id=ftxt>Gaze into the crystal ball and see what fortune holds for you today.</div><button onclick="tell()">Reveal my fortune ✦</button><small>For entertainment only</small></div></div>
  ${luckyCard()}<div class=grid>`+HG.map((x,i)=>`<div class=gcard style="--i:${i}"><div class="gin c${i%6}"><span class=fee>${x.fee} ${CFG.CURRENCY}</span>${x.image?`<img class=gimg src="${esc(x.image)}" alt="" onerror="this.remove()">`:`<div class=ic>${icon(x.name)}</div>`}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><ul>${String(x.prize||'').split('|').map(p=>`<li>✦ ${esc(p.trim())}</li>`).join('')}</ul></div></div>`).join('')+'</div>';

// ---------- PUBLIC: participant balance page (QR opens this) ----------
async function card(t){
  const{data}=await db.rpc('get_card',{t});
  app.innerHTML=data?`<div class=card><p>Hello ${esc(data.name)}</p><p>Your balance</p><div class=big>${data.balance} ${CFG.CURRENCY}</div><img src="${qrUrl(location.href)}" alt="QR" width=200><p>Show this QR at every game.</p></div>`:'<p>Card not found.</p>';
}
// ---------- LUCKY DRAW ----------
const pad=n=>String(n).padStart(3,'0');
const luckyCard=()=>`<a class=gcard href="#/lucky" style="--i:0;display:block;text-decoration:none;color:#fff;margin-bottom:18px"><div class="gin c2" style="display:flex;align-items:center;gap:16px"><div class=ic style="flex:none"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg></div><div><h3>Lucky Draw</h3><p>Book your ticket in advance. Rs ${CFG.TICKET_PRICE} per ticket, pick any numbers from 001 to 999. Tap to book.</p></div></div></a>`;
let LSEL=new Set(),LTK=new Set();
function lsum(){const a=[...LSEL].sort((x,y)=>x-y);$('#lsum').innerHTML=a.length?`<p><b>${a.length}</b> selected: ${a.map(pad).join(', ')}<br>Total: <b>Rs ${a.length*CFG.TICKET_PRICE}</b></p>`:'<p>Tap numbers to select them.</p>'}
function paintGrid(){document.querySelectorAll('#ng .n').forEach(e=>{const n=+e.dataset.n;e.className='n'+(LTK.has(n)?' t':'')+(LSEL.has(n)?' s':'')})}
async function lucky(){
  const{data}=await db.rpc('taken_numbers');LTK=new Set(data||[]);LSEL=new Set();
  let cells='';for(let i=1;i<=999;i++)cells+=`<span class=n data-n=${i}>${pad(i)}</span>`;
  app.innerHTML=`<div class=hero><h1 class=lt>Lucky Draw</h1><p>Rs ${CFG.TICKET_PRICE} per ticket &middot; numbers 001 to 999</p></div><div class=card id=lbox>
  <input id=ln placeholder="Your name"><input id=le type=email placeholder="Your email (your numbers are sent here)">
  <div class=pickrow><input id=tn type=number min=1 max=999 placeholder="Type a number, e.g. 7"><button onclick="addNum()">Add</button><button onclick="randNum()">Random</button></div>
  <div class=legend><small>◻ Available</small><small style="color:#f4d58d">◼ Selected</small><small style="opacity:.5">◻̶ Booked</small></div>
  <div class=ngrid id=ng>${cells}</div><div id=lsum></div><button onclick="book()">Book tickets</button><div id=lres></div></div>`;
  $('#ng').onclick=e=>{const n=+e.target.dataset.n;if(!n||LTK.has(n))return;LSEL.has(n)?LSEL.delete(n):LSEL.add(n);e.target.classList.toggle('s');lsum()};
  paintGrid();lsum();
}
function addNum(){const v=parseInt($('#tn').value);if(!(v>=1&&v<=999))return $('#lres').innerHTML='<p class=bad>Type a number between 1 and 999.</p>';
  if(LTK.has(v))return $('#lres').innerHTML='<p class=bad>'+pad(v)+' is already booked.</p>';
  $('#lres').innerHTML='';LSEL.add(v);paintGrid();lsum();$('#tn').value='';document.querySelector(`#ng [data-n="${v}"]`).scrollIntoView({block:'nearest'})}
function randNum(){const f=[];for(let i=1;i<=999;i++)if(!LTK.has(i)&&!LSEL.has(i))f.push(i);if(!f.length)return;LSEL.add(f[Math.floor(Math.random()*f.length)]);paintGrid();lsum()}
async function sendLucky(name,email,nums){
  const{data,error}=await db.functions.invoke('send-mail',{body:{mode:'lucky',email}});
  return(!error&&data&&data.ok)?'<span class=ok>Email sent ✔</span>':'<span class=bad>Email could not be sent. Please save your numbers.</span>'
}
async function book(){
  const name=$('#ln').value.trim(),email=$('#le').value.trim().toLowerCase(),nums=[...LSEL].sort((a,b)=>a-b);
  if(!name||!email||!nums.length)return $('#lres').innerHTML='<p class=bad>Please enter your name, your email and pick at least one number.</p>';
  $('#lres').innerHTML='<p>Booking...</p>';
  const{data,error}=await db.rpc('book_tickets',{p_name:name,p_email:email,p_nums:nums});
  if(error||!data.ok){const{data:t}=await db.rpc('taken_numbers');LTK=new Set(t||[]);nums.forEach(n=>LTK.has(n)&&LSEL.delete(n));paintGrid();lsum();return $('#lres').innerHTML='<p class=bad>'+esc(error?error.message:data.msg)+'</p>'}
  const mail=await sendLucky(name,email,nums);
  $('#lbox').innerHTML=`<h2 class=lt style="text-align:center">You're in!</h2><p style="text-align:center">${nums.map(n=>`<span class="chip d">${pad(n)}</span>`).join('')}</p>
  <p style="text-align:center">Amount to pay: <b>Rs ${nums.length*CFG.TICKET_PRICE}</b><br>${mail}</p>
  <p style="text-align:center">Scan to pay:<br><img src="${CFG.PAY_QR}" width=220 style="border-radius:12px;background:#fff;padding:6px" onerror="this.outerHTML='<i>(Payment QR will appear here soon)</i>'"></p>
  <p style="text-align:center;opacity:.8">Your numbers are reserved. They are confirmed once your payment is verified.</p>`;
}
// ---------- ADMIN: lucky draw ----------
let LT=[],LG=[];
async function luckyTab(){
  await stopScan();
  const{data}=await db.from('tickets').select('*').order('num');LT=data||[];
  const by={};LT.forEach(t=>by[t.num]=t);const paid=LT.filter(t=>t.status==='paid').length,pend=LT.length-paid;
  let cells='';for(let i=1;i<=999;i++){const t=by[i];cells+=`<span class="n${t?(t.status==='paid'?' d':' p'):''}" title="${pad(i)}${t?' - '+esc(t.name)+' ('+t.status+')':''}" style="cursor:default">${pad(i)}</span>`}
  $('#pane').innerHTML=`<div class=card><p>Booked: <b>${LT.length}</b> | Paid: <b>${paid}</b> | Waiting for payment: <b>${pend}</b> | Available: <b>${999-LT.length}</b> | Money confirmed: <b>Rs ${paid*CFG.TICKET_PRICE}</b></p>
  <div class=legend><small style="color:#22c55e">◼ Paid</small><small style="color:#f59e0b">◼ Waiting for payment</small><small>◻ Available</small></div><div class=ngrid>${cells}</div></div>
  <input id=lq placeholder="🔍 Search by name, email or number" oninput="showLucky()"><div id=llist></div>`;
  showLucky();
}
function showLucky(){
  const q=($('#lq').value||'').toLowerCase(),g={};
  LT.forEach(t=>{(g[t.email]=g[t.email]||{name:t.name,email:t.email,t:[]}).t.push(t)});
  LG=Object.values(g);
  $('#llist').innerHTML=LG.map((p,i)=>({p,i})).filter(({p})=>(p.name+' '+p.email+' '+p.t.map(t=>pad(t.num)).join(' ')).toLowerCase().includes(q)).map(({p,i})=>{
    const pe=p.t.filter(t=>t.status==='pending').length;
    return `<div class=card><b>${esc(p.name)}</b> <small>${esc(p.email)}</small><br>${p.t.map(t=>`<span class="chip ${t.status==='paid'?'d':'p'}">${pad(t.num)}</span>`).join('')}<br>Tickets: <b>${p.t.length}</b> | Waiting for payment: <b>Rs ${pe*CFG.TICKET_PRICE}</b>
    ${pe?`<button onclick="lpay(${i})">Mark paid</button><button onclick="lrel(${i},false)">Release unpaid numbers</button>`:''}<button onclick="lmail(${i})">Resend email</button><button onclick="lrel(${i},true)">Release ALL numbers</button></div>`}).join('')||'<p>No bookings yet.</p>';
}
async function lpay(i){const p=LG[i];await db.from('tickets').update({status:'paid'}).eq('email',p.email).eq('status','pending');luckyTab()}
async function lrel(i,all){const p=LG[i];if(!confirm('Release these numbers so others can book them?'))return;let q=db.from('tickets').delete().eq('email',p.email);if(!all)q=q.eq('status','pending');await q;luckyTab()}
async function lmail(i){const p=LG[i];alert((await sendLucky(p.name,p.email,p.t.map(t=>t.num))).replace(/<[^>]+>/g,''))}
// ---------- STAFF ----------
let MODE='volunteer';
function login(){app.innerHTML=`<h2>${MODE==='admin'?'Admin':'Volunteer'} login</h2><input id=em placeholder="Email"><input id=pw type=password placeholder="Password"><button onclick="doLogin()">Login</button><p id=err class=bad></p>`}
async function doLogin(){const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?$('#err').textContent=error.message:staff(MODE)}
async function out(){await db.auth.signOut();staff(MODE)}
async function staff(mode){
  MODE=mode||MODE;
  const{data:{session}}=await db.auth.getSession();if(!session)return login();
  const{data:p}=await db.from('profiles').select('role,name').eq('id',session.user.id).single();
  if(!p){app.innerHTML='<p>This account has no staff role. Ask the admin.</p><button onclick="out()">Logout</button>';return}
  if(MODE==='admin'&&p.role!=='admin'||MODE==='volunteer'&&p.role!=='volunteer'){app.innerHTML=`<p class=bad>This account is not a${MODE==='admin'?'n admin':' volunteer'} account. Please log out and use the correct login page.</p><button onclick="out()">Logout</button>`;return}
  const a=p.role==='admin';
  app.innerHTML=`<p>${esc(p.name||session.user.email)} (${p.role}) <button style="width:auto" onclick="out()">Logout</button></p>
  <div class=tabs><button onclick="scanTab()">Scan &amp; Charge</button>${a?'<button onclick="topTab()">Add Money</button><button onclick="partsTab()">Participants</button><button onclick="luckyTab()">Lucky Draw</button><button onclick="gamesTab()">Edit Games</button><button onclick="reportTab()">Report</button>':''}</div><div id=pane></div>`;
  scanTab();
}
let GAMES=[];
async function scanTab(){
  await stopScan();
  const{data:g}=await db.from('games').select('*').eq('active',true).order('id');const sn={};GAMES=(g||[]).filter(x=>!sn[x.name]&&(sn[x.name]=1));
  $('#pane').innerHTML='<p>Scan the participant QR</p><div id=rd></div><div id=res></div>';
  scanner=new Html5Qrcode('rd');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:240},async txt=>{
    const m=txt.match(/[0-9a-f]{8}-[0-9a-f-]{27}/i);if(!m)return;
    scanner.pause(true);
    const{data}=await db.rpc('get_card',{t:m[0]});
    $('#res').innerHTML=data?`<div class=card><b>${esc(data.name)}</b> - balance ${data.balance} ${CFG.CURRENCY}<p>Tap the game they are playing:</p>${GAMES.map(x=>`<button onclick="charge('${m[0]}',${x.id})">${esc(x.name)} - ${x.fee} ${CFG.CURRENCY}</button>`).join('')}<button style="background:#888" onclick="scanner.resume();$('#res').innerHTML=''">Cancel</button></div>`:'<p class=bad>Unknown QR</p><button onclick="scanner.resume();$(\'#res\').innerHTML=\'\'">Scan again</button>';
  },()=>{}).catch(e=>$('#res').innerHTML='<p class=bad>Camera error: '+esc(e)+'</p>');
}
async function charge(t,gid){
  const x=GAMES.find(y=>y.id===gid);
  if(!confirm('Deduct '+x.fee+' for '+x.name+'?'))return;
  const{data,error}=await db.rpc('charge',{p_token:t,p_game:gid});
  $('#res').innerHTML=`<div class=card><p class="${data&&data.ok?'ok':'bad'}">${esc(error?error.message:data.msg)}</p><button onclick="scanner.resume();$('#res').innerHTML=''">Scan next</button></div>`;
}
// ---------- ADMIN: add money + email QR ----------
async function topTab(){
  await stopScan();
  $('#pane').innerHTML=`<div class=card><h3>Add money</h3><input id=n placeholder="Name"><input id=e type=email placeholder="Gmail"><input id=a type=number placeholder="Amount (${CFG.CURRENCY})"><button onclick="topup()">Add money</button><div id=out></div></div>`;
}
async function topup(){
  const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),a=+$('#a').value;
  const{data,error}=await db.rpc('topup',{p_name:n,p_email:e,p_amount:a});
  if(error)return $('#out').innerHTML='<p class=bad>'+esc(error.message)+'</p>';
  const link=CFG.SITE_URL+'#/card/'+data.token;let mail;
  mail=await sendQR(n,e,data.balance,link);
  $('#out').innerHTML=`<p>New balance: <b>${data.balance}</b> ${mail}</p><img src="${qrUrl(link)}" width=200>`;
}
async function sendQR(n,e,bal,link){
  const{data,error}=await db.functions.invoke('send-mail',{body:{mode:'card',token:link.split('/card/')[1]}});
  return(!error&&data&&data.ok)?'<span class=ok>Email sent ✔</span>':'<span class=bad>Email failed ('+esc(error?error.message:(data&&data.msg))+') - show this QR to the person instead.</span>'
}
async function resendQR(t){
  const p=PARTS.find(x=>x.token===t),link=CFG.SITE_URL+'#/card/'+t;
  $('#pdet').insertAdjacentHTML('beforeend','<div class=card id=rq>Sending...</div>');
  const m=await sendQR(p.name,p.email,p.balance,link);
  $('#rq').innerHTML=m+'<br><img src="'+qrUrl(link)+'" width=200>';
}
// ---------- ADMIN: edit games ----------
async function gamesTab(){
  await stopScan();
  const{data:g}=await db.from('games').select('*').order('id');
  $('#pane').innerHTML=(g||[]).concat([{id:0,name:'',description:'',fee:0,prize:'',image:'',active:true}]).map(x=>`<div class=card id=g${x.id}>
  <input placeholder="Game name" value="${esc(x.name)}"><textarea placeholder="Description">${esc(x.description)}</textarea>
  <input type=number placeholder="Entry fee" value="${x.fee}"><input placeholder="Prize" value="${esc(x.prize)}"><input placeholder="Picture file, e.g. images/chess.jpg" value="${esc(x.image)}">
  <label><input type=checkbox style="width:auto" ${x.active?'checked':''}> Show on website</label>
  <button onclick="saveGame(${x.id})">${x.id?'Save':'Add new game'}</button>${x.id?`<button onclick="delGame(${x.id})">Delete</button>`:''}</div>`).join('');
}
async function saveGame(id){
  const[n,d,f,p,im,a]=document.querySelectorAll(`#g${id} input,#g${id} textarea`);
  const row={name:n.value,description:d.value,fee:+f.value,prize:p.value,image:im.value.trim(),active:a.checked};
  const{error}=await(id?db.from('games').update(row).eq('id',id):db.from('games').insert(row));
  error?alert(error.message):gamesTab();
}
async function delGame(id){if(confirm('Delete this game?')){await db.from('games').delete().eq('id',id);gamesTab()}}
// ---------- ADMIN: participants (search + history) ----------
let PARTS=[],SEL=null;
async function partsTab(){
  await stopScan();
  const{data}=await db.from('cards').select('token,name,email,balance').order('name');PARTS=data||[];SEL=null;
  $('#pane').innerHTML='<input id=q placeholder="🔍 Search by name or email" oninput="showParts()"><div id=pdet></div><div id=plist></div>';
  showParts();
}
function showParts(){
  const q=($('#q').value||'').toLowerCase();
  const L=PARTS.filter(x=>x.token!==SEL&&((x.name||'').toLowerCase().includes(q)||(x.email||'').toLowerCase().includes(q)));
  $('#plist').innerHTML=L.map(x=>`<div class=card style="cursor:pointer" onclick="partDetail('${x.token}')"><b>${esc(x.name)}</b> <small>${esc(x.email)}</small><br>Balance: <b>${x.balance}</b> ${CFG.CURRENCY} &nbsp;&rsaquo; tap for history</div>`).join('')||'<p>No participants found.</p>';
}
async function partDetail(t){
  const p=PARTS.find(x=>x.token===t);SEL=t;showParts();
  const{data}=await db.from('txns').select('amount,kind,created_at,games(name)').eq('token',t).order('created_at',{ascending:false});
  const tx=data||[];let add=0,sp=0;tx.forEach(x=>x.kind==='topup'?add+=x.amount:sp-=x.amount);
  $('#pdet').innerHTML=`<div class=card><h3>${esc(p.name)}</h3><p>${esc(p.email)}</p><p>Total recharged: <b>${add}</b> | Total spent: <b>${sp}</b> | Balance now: <b>${p.balance}</b></p><table><tr><th>When</th><th>What</th><th>Amount</th></tr>${tx.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.kind==='topup'?'Recharge':esc(x.games?x.games.name:'(deleted game)')}</td><td class="${x.amount>0?'ok':'bad'}">${x.amount>0?'+':''}${x.amount}</td></tr>`).join('')}</table><button onclick="resendQR('${t}')">Show QR / Resend email</button><button onclick="SEL=null;$('#pdet').innerHTML='';showParts()">Close</button></div>`;
  $('#pdet').scrollIntoView({behavior:'smooth'});
}
// ---------- ADMIN: report ----------
async function reportTab(){
  await stopScan();
  const{data:t}=await db.from('txns').select('amount,kind,created_at,cards(name),games(name)').order('created_at',{ascending:false}).limit(5000);
  const{data:c}=await db.from('cards').select('balance');
  const tx=t||[],per={};let col=0,spent=0;
  tx.forEach(x=>{if(x.kind==='topup')col+=x.amount;else{spent-=x.amount;const k=x.games?x.games.name:'(deleted game)';per[k]=(per[k]||0)-x.amount}});
  const held=(c||[]).reduce((s,x)=>s+x.balance,0);
  $('#pane').innerHTML=`<div class=card><button onclick="reportTab()">Refresh</button><p>Total money added: <b>${col}</b> | Spent in games: <b>${spent}</b> | Still unspent on cards: <b>${held}</b> | Participants: <b>${(c||[]).length}</b></p>
  <h3>Per game</h3><table>${Object.entries(per).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>
  <h3>Recent activity</h3><table>${tx.slice(0,50).map(x=>`<tr><td>${new Date(x.created_at).toLocaleTimeString()}</td><td>${esc(x.cards&&x.cards.name)}</td><td>${x.kind==='topup'?'added':esc(x.games&&x.games.name)}</td><td>${x.amount}</td></tr>`).join('')}</table></div>`;
}

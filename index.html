<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== LOOK & FEEL: change colours here ===== */
:root{--bg1:#1a0b3d;--bg2:#0b1d4a;--pink:#ff2d95;--cyan:#00e5ff;--yellow:#ffd60a;--text:#fff;--card:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--text);min-height:100vh;
background:radial-gradient(circle at 15% 10%,#6a11cb55,transparent 40%),radial-gradient(circle at 85% 30%,#ff2d9544,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:14px 18px;background:rgba(10,5,35,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:2px solid var(--pink)}
header b{font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
header a{color:#fff;margin-left:14px;text-decoration:none;font-weight:600;font-size:.9rem}header a:hover{color:var(--cyan)}
main{max-width:900px;margin:auto;padding:16px}
.hero{text-align:center;padding:30px 12px 18px}
.hero h1{font-size:2.6rem;font-weight:800;margin:0;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #ff2d9555}
.hero p{font-size:1.1rem;color:#d9d4ff;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gcard{border-radius:20px;padding:3px;position:relative;overflow:hidden;box-shadow:0 8px 24px #0006;transition:transform .2s;animation:rise .7s both;animation-delay:calc(var(--i)*.12s)}
.gcard:hover{transform:translateY(-6px) rotate(-.5deg)}
.gcard h3{margin:6px 0;font-size:1.25rem}.gcard p{font-size:.92rem;opacity:.95}
.gcard .ic{font-size:2.6rem}
.gimg{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:6px;display:block}
.fee{position:absolute;top:14px;right:14px;background:#000a;padding:5px 12px;border-radius:20px;font-weight:800;color:var(--yellow)}
.gcard ul{list-style:none;padding:0;margin:8px 0 0}.gcard li{background:#0007;border-radius:10px;padding:5px 10px;margin:5px 0;font-size:.85rem}
.c0{background:linear-gradient(135deg,#ff2d95,#7b2ff7)}.c1{background:linear-gradient(135deg,#00c6ff,#0072ff)}
.c2{background:linear-gradient(135deg,#f7971e,#ff2d95)}.c3{background:linear-gradient(135deg,#11998e,#38ef7d)}
.c4{background:linear-gradient(135deg,#7b2ff7,#00e5ff)}.c5{background:linear-gradient(135deg,#ff512f,#dd2476)}
.card{background:var(--card);border:1px solid #ffffff30;border-radius:16px;padding:16px;margin:12px 0;backdrop-filter:blur(6px)}
input,select,textarea,button{width:100%;padding:11px;margin:5px 0;border-radius:12px;border:0;font-size:1rem;font-family:inherit}
button{background:linear-gradient(90deg,var(--pink),#ff7b2d);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #ff2d9566;transition:transform .15s}
button:hover{transform:scale(1.03)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{width:auto;flex:1}
.ok{color:#6fe58a;font-weight:600}.bad{color:#ff8a8a;font-weight:600}
.big{font-size:3.2rem;font-weight:800;color:var(--yellow);margin:6px 0;text-shadow:0 0 20px #ffd60a88}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ffffff25;text-align:left;font-size:.9rem}

/* running light band around each game card */
.gcard::before{content:"";position:absolute;inset:-60%;background:conic-gradient(transparent 0 55%,var(--cyan),#fff,var(--yellow),var(--pink),transparent 95%);animation:spin 3.5s linear infinite}
.gin{position:relative;z-index:1;border-radius:17px;padding:18px;height:100%}
.gcard .ic{display:inline-block;animation:float 2.6s ease-in-out infinite}
.fee{animation:pulse 1.8s ease-in-out infinite}
.hero h1{background-size:200% auto;animation:shine 4s linear infinite}
.hero p{animation:rise .8s both .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shine{to{background-position:200% center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* glossy 3D icons */
.gcard .ic{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:2.7rem;border-radius:26px;position:relative;overflow:hidden;margin-bottom:6px;background:linear-gradient(145deg,#ffffff55,#00000045);border:1px solid #ffffff77;box-shadow:inset 0 4px 8px #fffb,inset 0 -10px 16px #0007,0 12px 20px #0009,0 0 18px #ffffff33}
.gcard .ic::before{content:"";position:absolute;top:0;left:0;right:0;height:48%;background:linear-gradient(180deg,#ffffffb0,#ffffff10);border-radius:26px 26px 60% 60%/26px 26px 30% 30%;z-index:1}
.gcard .ic::after{content:"";position:absolute;top:-20%;left:-60%;width:35%;height:140%;background:linear-gradient(90deg,transparent,#fffc,transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.3s);z-index:3}
.gcard .ic span{position:relative;z-index:2;filter:drop-shadow(0 5px 3px #000a)}
.gcard:hover .ic span{animation:wiggle .6s}
@keyframes sweep{0%,55%{left:-60%}100%{left:140%}}
@keyframes wiggle{25%{transform:rotate(-18deg) scale(1.25)}75%{transform:rotate(18deg) scale(1.25)}}
/* animated aurora background */
body{background:#0a0420}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#1a0b3d,#0b1d4a)}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(80px);opacity:.6;animation:drift 14s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#ff2d95;top:-20vmax;left:-15vmax}
.bg i:nth-child(2){background:#00c6ff;bottom:-22vmax;right:-15vmax;animation-delay:-5s}
.bg i:nth-child(3){background:#7b2ff7;top:20%;left:30%;animation-delay:-9s;opacity:.5}
.bg i:nth-child(4){background:#ff8a00;bottom:-10vmax;left:-10vmax;animation-delay:-3s;opacity:.35}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,#fff9,transparent),radial-gradient(3px 3px at 160px 60px,#ffd60a,transparent),radial-gradient(2px 2px at 210px 170px,#00e5ff,transparent),radial-gradient(2px 2px at 50px 180px,#ff9ad5,transparent);background-size:250px 210px;animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(12vmax,8vmax) scale(1.25)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
/* super glossy orb icons */
.c0{--o1:#ff9ad5;--o2:#8a1fd1}.c1{--o1:#7ee3ff;--o2:#0057d9}.c2{--o1:#ffd27a;--o2:#e0207a}.c3{--o1:#9bffc4;--o2:#08806f}.c4{--o1:#c9a6ff;--o2:#0091b8}.c5{--o1:#ffb08a;--o2:#b3126b}
.gcard .ic{width:96px;height:96px;border-radius:50%;font-size:3rem;border:2px solid #ffffff88;background:radial-gradient(circle at 50% 60%,var(--o1),var(--o2) 78%);box-shadow:inset 0 -14px 22px #000a,inset 0 8px 14px #fffa,0 16px 26px #000a,0 0 34px var(--o1);animation:float 2.6s ease-in-out infinite,glow 2.2s ease-in-out infinite alternate}
.gcard .ic::before{top:5%;left:13%;right:auto;width:52%;height:32%;border-radius:50%;background:linear-gradient(180deg,#fffffff2,#ffffff12);transform:rotate(-22deg);z-index:3}
.gcard .ic::after{z-index:4}
.gcard .ic span{z-index:2;font-size:3rem;filter:drop-shadow(0 6px 4px #000b)}
@keyframes glow{from{box-shadow:inset 0 -14px 22px #000a,inset 0 8px 14px #fffa,0 16px 26px #000a,0 0 18px var(--o1)}to{box-shadow:inset 0 -14px 22px #000a,inset 0 8px 14px #fffa,0 16px 26px #000a,0 0 46px var(--o1)}}
/* aesthetic preloader */
#pre{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#0a0420;transition:opacity .7s,visibility .7s}
#pre.hide{opacity:0;visibility:hidden;pointer-events:none}
.pload{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--pink),var(--yellow),var(--cyan),var(--pink));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 2.2s linear infinite;filter:drop-shadow(0 0 10px var(--pink))}
.ring2{position:absolute;inset:16px;border-radius:50%;border:2px dashed #ffffff66;animation:spin 6s linear infinite reverse}
.dots{position:absolute;inset:0;animation:spin 3s linear infinite}
.dots b{position:absolute;width:12px;height:12px;border-radius:50%;left:50%;top:-6px;margin-left:-6px;background:var(--cyan);box-shadow:0 0 14px 4px var(--cyan)}
.dots b:nth-child(2){top:50%;left:auto;right:-6px;margin:-6px 0 0;background:var(--yellow);box-shadow:0 0 14px 4px var(--yellow)}
.dots b:nth-child(3){top:auto;bottom:-6px;background:var(--pink);box-shadow:0 0 14px 4px var(--pink)}
.pcore{--o1:#ff9ad5;--o2:#8a1fd1;position:relative;width:114px;height:114px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:radial-gradient(circle at 50% 60%,var(--o1),var(--o2) 78%);border:2px solid #ffffff88;box-shadow:inset 0 -14px 22px #000a,inset 0 8px 14px #fffa,0 0 40px var(--o1);animation:float 2.6s ease-in-out infinite}
.pcore::before{content:"";position:absolute;top:5%;left:13%;width:52%;height:32%;border-radius:50%;background:linear-gradient(180deg,#fffffff2,#ffffff12);transform:rotate(-22deg)}
.pcore span{position:relative;filter:drop-shadow(0 6px 4px #000b)}
.ptxt{font-weight:800;font-size:2rem;letter-spacing:6px;color:#fff;text-shadow:0 0 12px var(--pink),0 0 30px var(--cyan);white-space:pre}
.ptxt span{display:inline-block;opacity:0;animation:letter .6s forwards;animation-delay:calc(var(--d)*.09s + .2s)}
.psub{color:#d9d4ff;letter-spacing:4px;font-size:.8rem;text-transform:uppercase;opacity:.85}
.pbar{width:240px;height:5px;border-radius:5px;background:#ffffff22;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan));box-shadow:0 0 12px var(--pink)}
.pct{font-weight:800;color:var(--yellow);text-shadow:0 0 10px var(--yellow)}
@keyframes letter{from{opacity:0;transform:translateY(22px) scale(.5)}to{opacity:1;transform:none}}
</style></head><body>
<div class="bg"><i></i><i></i><i></i><i></i></div>
<div id="pre"><div class="bg"><i></i><i></i><i></i><i></i></div><div class="pload"><div class="ring"></div><div class="ring2"></div><div class="dots"><b></b><b></b><b></b></div><div class="pcore"><span>🎮</span></div></div><div class="ptxt"><span style="--d:0">G</span><span style="--d:1">A</span><span style="--d:2">M</span><span style="--d:3">E</span><span style="--d:4">&nbsp;</span><span style="--d:5">Z</span><span style="--d:6">O</span><span style="--d:7">N</span><span style="--d:8">E</span></div><div class="psub">Loading the fun</div><div class="pbar"><i id="pfill"></i></div><div class="pct" id="pct">0%</div></div>
<header><b id="ev"></b><nav><a href="#/">Games</a><a href="#/volunteer">Volunteer Login</a><a href="#/admin">Admin Login</a></nav></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
// ================= EDIT HERE (settings) =================
const CFG={
  EVENT_NAME:"Game Zone",                       // title shown on top
  CURRENCY:"pts",                               // 1 pt = 1 rupee (your choice)
  SUPABASE_URL:"https://zcinfveweiirbuapsrzn.supabase.co",            // Supabase > Project Settings > API
  SUPABASE_KEY:"sb_publishable_cJVKnUFVOnTEa9QajBBEZg_8qurMRXo",       // the "anon public" key
  SITE_URL:"https://vabesh-lucky.github.io/gamezone/", // your final website address (keep trailing /)
  EMAILJS_PUBLIC_KEY:"A67uGW406JCBM3esm", EMAILJS_SERVICE:"service_lb4jt3d", EMAILJS_TEMPLATE:"template_5h9wjvm"  // from emailjs.com
};
// ========================================================
document.getElementById('ev').textContent=CFG.EVENT_NAME;
const db=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qrUrl=l=>'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(l);
let scanner=null;
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}}
async function route(){
  await stopScan();const h=location.hash||'#/';
  if(h.startsWith('#/card/'))return card(h.slice(7));
  if(h.startsWith('#/admin'))return staff('admin');
  if(h.startsWith('#/volunteer')||h.startsWith('#/staff'))return staff('volunteer');
  home();
}
addEventListener('hashchange',route);route();
const hidePre=()=>{const p=$('#pre');p&&p.classList.add('hide')};
(function(){const t0=performance.now(),el=$('#pct'),fill=$('#pfill');let ready=document.readyState==='complete';addEventListener('load',()=>ready=true);
function tick(t){const p=Math.min(1,(t-t0)/2000);el.textContent=Math.round(p*100)+'%';fill.style.width=p*100+'%';if(p<1||!ready)requestAnimationFrame(tick);else setTimeout(hidePre,300)}
requestAnimationFrame(tick);setTimeout(hidePre,6000)})();

// ---------- PUBLIC: games list ----------
const ICONS=[['chess','♟️'],['dart','🎯'],['bottle','🍾'],['ring','💍'],['buzz','⚡'],['table','🏓'],['ball','🥤'],['7','🎲']];
const icon=n=>{n=n.toLowerCase();for(const[k,v]of ICONS)if(n.includes(k))return v;return '🎮'};
async function home(){
  const{data:g}=await db.from('games').select('*').eq('active',true).order('id');
  const seen={};
  app.innerHTML=`<div class=hero><h1>🎮 ${esc(CFG.EVENT_NAME)} 🏆</h1><p>Play fun games &bull; Score big &bull; Win cash prizes!</p></div><div class=grid>`+(g||[]).filter(x=>!seen[x.name]&&(seen[x.name]=1)).map((x,i)=>`<div class=gcard style="--i:${i}"><div class="gin c${i%6}"><span class=fee>${x.fee} ${CFG.CURRENCY}</span>${x.image?`<img class=gimg src="${esc(x.image)}" alt="" onerror="this.remove()">`:`<div class=ic><span>${icon(x.name)}</span></div>`}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><ul>${String(x.prize||'').split('|').map(p=>`<li>🏆 ${esc(p.trim())}</li>`).join('')}</ul></div></div>`).join('')+'</div>';
}
// ---------- PUBLIC: participant balance page (QR opens this) ----------
async function card(t){
  const{data}=await db.rpc('get_card',{t});
  app.innerHTML=data?`<div class=card><p>Hello ${esc(data.name)}</p><p>Your balance</p><div class=big>${data.balance} ${CFG.CURRENCY}</div><img src="${qrUrl(location.href)}" alt="QR" width=200><p>Show this QR at every game.</p></div>`:'<p>Card not found.</p>';
}
// ---------- STAFF ----------
let MODE='volunteer';
function login(){app.innerHTML=`<h2>${MODE==='admin'?'Admin':'Volunteer'} login</h2><input id=em placeholder="Email"><input id=pw type=password placeholder="Password"><button onclick="doLogin()">Login</button><p id=err class=bad></p>`}
async function doLogin(){const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?$('#err').textContent=error.message:staff(MODE)}
async function out(){await db.auth.signOut();staff(MODE)}
async function staff(mode){
  MODE=mode||MODE;
  const{data:{session}}=await db.auth.getSession();if(!session)return login();
  const{data:p}=await db.from('profiles').select('role,name').eq('id',session.user.id).single();
  if(!p){app.innerHTML='<p>This account has no staff role. Ask the admin.</p><button onclick="out()">Logout</button>';return}
  if(MODE==='admin'&&p.role!=='admin'||MODE==='volunteer'&&p.role!=='volunteer'){app.innerHTML=`<p class=bad>This account is not a${MODE==='admin'?'n admin':' volunteer'} account. Please log out and use the correct login page.</p><button onclick="out()">Logout</button>`;return}
  const a=p.role==='admin';
  app.innerHTML=`<p>${esc(p.name||session.user.email)} (${p.role}) <button style="width:auto" onclick="out()">Logout</button></p>
  <div class=tabs><button onclick="scanTab()">Scan &amp; Charge</button>${a?'<button onclick="topTab()">Add Money</button><button onclick="partsTab()">Participants</button><button onclick="gamesTab()">Edit Games</button><button onclick="reportTab()">Report</button>':''}</div><div id=pane></div>`;
  scanTab();
}
let GAMES=[];
async function scanTab(){
  await stopScan();
  const{data:g}=await db.from('games').select('*').eq('active',true).order('id');const sn={};GAMES=(g||[]).filter(x=>!sn[x.name]&&(sn[x.name]=1));
  $('#pane').innerHTML='<p>Scan the participant QR</p><div id=rd></div><div id=res></div>';
  scanner=new Html5Qrcode('rd');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:240},async txt=>{
    const m=txt.match(/[0-9a-f]{8}-[0-9a-f-]{27}/i);if(!m)return;
    scanner.pause(true);
    const{data}=await db.rpc('get_card',{t:m[0]});
    $('#res').innerHTML=data?`<div class=card><b>${esc(data.name)}</b> - balance ${data.balance} ${CFG.CURRENCY}<p>Tap the game they are playing:</p>${GAMES.map(x=>`<button onclick="charge('${m[0]}',${x.id})">${esc(x.name)} - ${x.fee} ${CFG.CURRENCY}</button>`).join('')}<button style="background:#888" onclick="scanner.resume();$('#res').innerHTML=''">Cancel</button></div>`:'<p class=bad>Unknown QR</p><button onclick="scanner.resume();$(\'#res\').innerHTML=\'\'">Scan again</button>';
  },()=>{}).catch(e=>$('#res').innerHTML='<p class=bad>Camera error: '+esc(e)+'</p>');
}
async function charge(t,gid){
  const x=GAMES.find(y=>y.id===gid);
  if(!confirm('Deduct '+x.fee+' for '+x.name+'?'))return;
  const{data,error}=await db.rpc('charge',{p_token:t,p_game:gid});
  $('#res').innerHTML=`<div class=card><p class="${data&&data.ok?'ok':'bad'}">${esc(error?error.message:data.msg)}</p><button onclick="scanner.resume();$('#res').innerHTML=''">Scan next</button></div>`;
}
// ---------- ADMIN: add money + email QR ----------
async function topTab(){
  await stopScan();
  $('#pane').innerHTML=`<div class=card><h3>Add money</h3><input id=n placeholder="Name"><input id=e type=email placeholder="Gmail"><input id=a type=number placeholder="Amount (${CFG.CURRENCY})"><label><input type=checkbox id=fm style="width:auto"> Email the QR again (only needed for recharges)</label><button onclick="topup()">Add money</button><div id=out></div></div>`;
}
async function topup(){
  const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),a=+$('#a').value;
  const{data:ex}=await db.from('cards').select('token').eq('email',e).maybeSingle();
  const{data,error}=await db.rpc('topup',{p_name:n,p_email:e,p_amount:a});
  if(error)return $('#out').innerHTML='<p class=bad>'+esc(error.message)+'</p>';
  const link=CFG.SITE_URL+'#/card/'+data.token;let mail;
  if(!ex||$('#fm').checked){mail=await sendQR(n,e,data.balance,link)}
  else mail='<span class=ok>Recharge saved. No email sent, the person already has their QR.</span>';
  $('#out').innerHTML=`<p>New balance: <b>${data.balance}</b> ${mail}</p><img src="${qrUrl(link)}" width=200>`;
}
async function sendQR(n,e,bal,link){
  try{await emailjs.send(CFG.EMAILJS_SERVICE,CFG.EMAILJS_TEMPLATE,{to_email:e,name:n,balance:bal,card_link:link,qr_image:qrUrl(link)},{publicKey:CFG.EMAILJS_PUBLIC_KEY});return '<span class=ok>Email sent ✔</span>'}
  catch(x){return '<span class=bad>Email failed ('+esc((x&&(x.status+" "+(x.text||x.message)))||x)+') - show this QR to the person instead.</span>'}
}
async function resendQR(t){
  const p=PARTS.find(x=>x.token===t),link=CFG.SITE_URL+'#/card/'+t;
  $('#pdet').insertAdjacentHTML('beforeend','<div class=card id=rq>Sending...</div>');
  const m=await sendQR(p.name,p.email,p.balance,link);
  $('#rq').innerHTML=m+'<br><img src="'+qrUrl(link)+'" width=200>';
}
// ---------- ADMIN: edit games ----------
async function gamesTab(){
  await stopScan();
  const{data:g}=await db.from('games').select('*').order('id');
  $('#pane').innerHTML=(g||[]).concat([{id:0,name:'',description:'',fee:0,prize:'',image:'',active:true}]).map(x=>`<div class=card id=g${x.id}>
  <input placeholder="Game name" value="${esc(x.name)}"><textarea placeholder="Description">${esc(x.description)}</textarea>
  <input type=number placeholder="Entry fee" value="${x.fee}"><input placeholder="Prize" value="${esc(x.prize)}"><input placeholder="Picture file, e.g. images/chess.jpg" value="${esc(x.image)}">
  <label><input type=checkbox style="width:auto" ${x.active?'checked':''}> Show on website</label>
  <button onclick="saveGame(${x.id})">${x.id?'Save':'Add new game'}</button>${x.id?`<button onclick="delGame(${x.id})">Delete</button>`:''}</div>`).join('');
}
async function saveGame(id){
  const[n,d,f,p,im,a]=document.querySelectorAll(`#g${id} input,#g${id} textarea`);
  const row={name:n.value,description:d.value,fee:+f.value,prize:p.value,image:im.value.trim(),active:a.checked};
  const{error}=await(id?db.from('games').update(row).eq('id',id):db.from('games').insert(row));
  error?alert(error.message):gamesTab();
}
async function delGame(id){if(confirm('Delete this game?')){await db.from('games').delete().eq('id',id);gamesTab()}}
// ---------- ADMIN: participants (search + history) ----------
let PARTS=[],SEL=null;
async function partsTab(){
  await stopScan();
  const{data}=await db.from('cards').select('token,name,email,balance').order('name');PARTS=data||[];SEL=null;
  $('#pane').innerHTML='<input id=q placeholder="🔍 Search by name or email" oninput="showParts()"><div id=pdet></div><div id=plist></div>';
  showParts();
}
function showParts(){
  const q=($('#q').value||'').toLowerCase();
  const L=PARTS.filter(x=>x.token!==SEL&&((x.name||'').toLowerCase().includes(q)||(x.email||'').toLowerCase().includes(q)));
  $('#plist').innerHTML=L.map(x=>`<div class=card style="cursor:pointer" onclick="partDetail('${x.token}')"><b>${esc(x.name)}</b> <small>${esc(x.email)}</small><br>Balance: <b>${x.balance}</b> ${CFG.CURRENCY} &nbsp;&rsaquo; tap for history</div>`).join('')||'<p>No participants found.</p>';
}
async function partDetail(t){
  const p=PARTS.find(x=>x.token===t);SEL=t;showParts();
  const{data}=await db.from('txns').select('amount,kind,created_at,games(name)').eq('token',t).order('created_at',{ascending:false});
  const tx=data||[];let add=0,sp=0;tx.forEach(x=>x.kind==='topup'?add+=x.amount:sp-=x.amount);
  $('#pdet').innerHTML=`<div class=card><h3>${esc(p.name)}</h3><p>${esc(p.email)}</p><p>Total recharged: <b>${add}</b> | Total spent: <b>${sp}</b> | Balance now: <b>${p.balance}</b></p><table><tr><th>When</th><th>What</th><th>Amount</th></tr>${tx.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.kind==='topup'?'Recharge':esc(x.games?x.games.name:'(deleted game)')}</td><td class="${x.amount>0?'ok':'bad'}">${x.amount>0?'+':''}${x.amount}</td></tr>`).join('')}</table><button onclick="resendQR('${t}')">Show QR / Resend email</button><button onclick="SEL=null;$('#pdet').innerHTML='';showParts()">Close</button></div>`;
  $('#pdet').scrollIntoView({behavior:'smooth'});
}
// ---------- ADMIN: report ----------
async function reportTab(){
  await stopScan();
  const{data:t}=await db.from('txns').select('amount,kind,created_at,cards(name),games(name)').order('created_at',{ascending:false}).limit(5000);
  const{data:c}=await db.from('cards').select('balance');
  const tx=t||[],per={};let col=0,spent=0;
  tx.forEach(x=>{if(x.kind==='topup')col+=x.amount;else{spent-=x.amount;const k=x.games?x.games.name:'(deleted game)';per[k]=(per[k]||0)-x.amount}});
  const held=(c||[]).reduce((s,x)=>s+x.balance,0);
  $('#pane').innerHTML=`<div class=card><button onclick="reportTab()">Refresh</button><p>Total money added: <b>${col}</b> | Spent in games: <b>${spent}</b> | Still unspent on cards: <b>${held}</b> | Participants: <b>${(c||[]).length}</b></p>
  <h3>Per game</h3><table>${Object.entries(per).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>
  <h3>Recent activity</h3><table>${tx.slice(0,50).map(x=>`<tr><td>${new Date(x.created_at).toLocaleTimeString()}</td><td>${esc(x.cards&&x.cards.name)}</td><td>${x.kind==='topup'?'added':esc(x.games&&x.games.name)}</td><td>${x.amount}</td></tr>`).join('')}</table></div>`;
}
</script></body></html>
